name = "the-unblocked-installer"
main = "worker.js"
compatibility_date = "2024-11-01"

[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "unblocked-installer"
database_id = "PASTE-YOUR-D1-DATABASE-ID-HERE"

[[r2_buckets]]
binding = "APPS"
bucket_name = "unblocked-installer-files"
